# v 로 시작하는 태그(예: v0.2.0)를 올리면 윈도우 설치 파일을 만들어 GitHub Releases 에 올린다.
# 함께 올라가는 latest.yml 을 설치한 앱(electron-updater)이 읽어 새 버전을 알아챈다.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 태그와 package.json 버전이 같은지 확인
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "태그($GITHUB_REF_NAME)와 package.json 버전(v$v)이 다릅니다"; exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
